<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420" role="img" aria-labelledby="bouquetTitle bouquetDesc">
  <title id="bouquetTitle">Watercolour bouquet</title>
  <desc id="bouquetDesc">A watercolour-style bouquet of blush roses, ivory blooms, muted lilac flowers and soft green foliage, painted without a rectangular background.</desc>
  <defs>
    <radialGradient id="washBlush" cx="38%" cy="32%" r="72%">
      <stop offset="0" stop-color="#f7d4cc" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#e4b0ab" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#c98b88" stop-opacity="0.18"/>
    </radialGradient>
    <radialGradient id="washIvory" cx="42%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fff8ee" stop-opacity="0.96"/>
      <stop offset="0.6" stop-color="#f0e2c4" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#e2cf9f" stop-opacity="0.12"/>
    </radialGradient>
    <radialGradient id="washLilac" cx="40%" cy="34%" r="68%">
      <stop offset="0" stop-color="#efe4f2" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#cbb4d4" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#a88bb3" stop-opacity="0.16"/>
    </radialGradient>
    <radialGradient id="washLeaf" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#d5e4d4" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#9fb89f" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#6f8d74" stop-opacity="0.2"/>
    </radialGradient>
    <linearGradient id="stemSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8aa388"/>
      <stop offset="1" stop-color="#5f7462"/>
    </linearGradient>
    <linearGradient id="ribbonSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d7d1"/>
      <stop offset="0.5" stop-color="#e8b8b2"/>
      <stop offset="1" stop-color="#c98b88"/>
    </linearGradient>
    <filter id="paperGrain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="multiply"/>
    </filter>
  </defs>

  <!-- Loose watercolour foliage, no bounding rectangle -->
  <g fill="url(#washLeaf)" filter="url(#paperGrain)" opacity="0.92">
    <ellipse cx="86" cy="168" rx="48" ry="22" transform="rotate(-48 86 168)"/>
    <ellipse cx="68" cy="214" rx="54" ry="20" transform="rotate(-28 68 214)"/>
    <ellipse cx="238" cy="156" rx="50" ry="21" transform="rotate(42 238 156)"/>
    <ellipse cx="256" cy="208" rx="52" ry="19" transform="rotate(24 256 208)"/>
    <ellipse cx="104" cy="268" rx="40" ry="16" transform="rotate(-62 104 268)"/>
    <ellipse cx="214" cy="274" rx="38" ry="15" transform="rotate(58 214 274)"/>
    <path d="M118 148 C 92 118, 74 128, 78 154 C 62 148, 58 172, 84 176 C 72 198, 108 204, 118 178 C 136 198, 154 176, 138 160 C 148 142, 132 132, 118 148 Z"/>
    <path d="M206 142 C 232 114, 250 126, 244 150 C 264 146, 266 172, 238 176 C 250 196, 214 204, 206 176 C 188 194, 172 174, 188 156 C 176 138, 192 128, 206 142 Z"/>
  </g>

  <g fill="none" stroke="url(#stemSoft)" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
    <path d="M160 368 C 156 300, 128 250, 96 198"/>
    <path d="M160 368 C 162 304, 170 246, 198 188"/>
    <path d="M160 368 C 150 310, 146 268, 138 214"/>
    <path d="M160 368 C 170 312, 186 258, 214 220"/>
    <path d="M160 368 C 158 320, 160 280, 160 236"/>
  </g>

  <!-- Ivory rose, upper left -->
  <g transform="translate(78 108)" filter="url(#paperGrain)">
    <ellipse cx="36" cy="40" rx="44" ry="40" fill="url(#washIvory)"/>
    <path d="M18 46 C 12 22, 36 8, 50 24 C 64 8, 86 26, 72 46 C 86 62, 62 82, 44 70 C 28 84, 8 64, 18 46 Z" fill="#f7ecd4" fill-opacity="0.72"/>
    <path d="M30 48 C 28 34, 44 28, 50 40 C 58 30, 70 42, 60 52 C 68 62, 50 70, 44 60 C 36 70, 24 58, 30 48 Z" fill="#fffdf7" fill-opacity="0.8"/>
    <ellipse cx="46" cy="48" rx="8" ry="7" fill="#f0d7b0" fill-opacity="0.7"/>
  </g>

  <!-- Blush rose, centre -->
  <g transform="translate(112 86)" filter="url(#paperGrain)">
    <ellipse cx="48" cy="48" rx="52" ry="48" fill="url(#washBlush)"/>
    <path d="M22 54 C 16 24, 46 6, 62 28 C 78 8, 108 28, 90 54 C 110 72, 84 100, 60 86 C 40 104, 12 78, 22 54 Z" fill="#f3c4be" fill-opacity="0.55"/>
    <path d="M36 56 C 34 38, 54 30, 62 46 C 72 34, 88 48, 76 60 C 88 74, 66 86, 58 72 C 48 86, 30 70, 36 56 Z" fill="#fae0dc" fill-opacity="0.75"/>
    <ellipse cx="58" cy="56" rx="9" ry="8" fill="#d89a94" fill-opacity="0.55"/>
  </g>

  <!-- Lilac bloom, upper right -->
  <g transform="translate(176 112)" filter="url(#paperGrain)">
    <ellipse cx="40" cy="38" rx="46" ry="42" fill="url(#washLilac)"/>
    <circle cx="24" cy="34" r="14" fill="#e7d6ec" fill-opacity="0.75"/>
    <circle cx="42" cy="24" r="13" fill="#f4eef6" fill-opacity="0.8"/>
    <circle cx="58" cy="36" r="14" fill="#d8c0e0" fill-opacity="0.7"/>
    <circle cx="44" cy="48" r="12" fill="#cbb0d4" fill-opacity="0.55"/>
    <circle cx="40" cy="36" r="6" fill="#f7f1d8" fill-opacity="0.85"/>
  </g>

  <!-- Smaller blush, lower left -->
  <g transform="translate(70 176)" filter="url(#paperGrain)">
    <ellipse cx="34" cy="32" rx="36" ry="32" fill="url(#washBlush)"/>
    <path d="M18 34 C 16 18, 34 12, 40 24 C 48 14, 62 24, 52 36 C 60 46, 44 54, 38 44 C 30 54, 14 44, 18 34 Z" fill="#f8ddd8" fill-opacity="0.7"/>
  </g>

  <!-- Ivory, lower right -->
  <g transform="translate(188 172)" filter="url(#paperGrain)">
    <ellipse cx="34" cy="34" rx="38" ry="34" fill="url(#washIvory)"/>
    <path d="M18 36 C 16 20, 34 12, 42 26 C 50 16, 66 28, 54 40 C 64 50, 46 60, 40 48 C 32 58, 14 48, 18 36 Z" fill="#fffaf0" fill-opacity="0.72"/>
  </g>

  <!-- Tiny lilac sprigs -->
  <g fill="#d4c0dc" fill-opacity="0.7">
    <circle cx="150" cy="78" r="7"/>
    <circle cx="164" cy="70" r="5.5"/>
    <circle cx="172" cy="82" r="6"/>
    <circle cx="112" cy="96" r="5"/>
    <circle cx="230" cy="128" r="6"/>
    <circle cx="92" cy="150" r="5"/>
  </g>

  <!-- Soft blush ribbon, not a box -->
  <g transform="translate(160 318)" fill="url(#ribbonSoft)">
    <path d="M-10 -8 C -4 -18, 4 -18, 10 -8 C 4 0, -4 0, -10 -8 Z" opacity="0.95"/>
    <path d="M-6 0 C -40 18, -48 42, -28 58 C -18 36, -8 20, 0 8 Z" opacity="0.8"/>
    <path d="M6 0 C 40 18, 48 42, 28 58 C 18 36, 8 20, 0 8 Z" opacity="0.8"/>
  </g>
</svg>
